<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AA.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F7F4" />
    <meta
      name="description"
            content="Ayoub Alouan, software engineer: backend services in Java and Python, data pipelines, AI features, web interfaces, testing and cloud deployment."
    />
    <script>
      // Apply the saved (or system) theme before the page paints, to avoid a flash
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.dataset.theme = "dark";
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#111814");
          }
        } catch (e) {}
      })();
    </script>
    <title>Ayoub Alouan · Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
